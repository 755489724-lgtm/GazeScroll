name: Android CI

# 推送 main 或提交 PR 时自动编译，验证代码能否通过构建
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 编译 Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4
        # 必须显式覆盖 packages。该 action 的默认值是 "tools platform-tools"，
        # 而 Google 的 SDK 仓库早已不再提供 `tools` 包：
        #   Warning: Failed to find package 'tools'
        #   Error: The process '.../sdkmanager' failed with exit code 1
        # 于是「配置 Android SDK」这一步在 v3 和 v4 上都会失败（升到 v4 只修了调用
        # 方式，没改默认包列表）。`tools` 本来也不需要——AGP 用的是 cmdline-tools、
        # platform-tools 和 build-tools。
        with:
          packages: 'platform-tools'

      - name: 安装所需的 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 缓存 Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 给 gradlew 加可执行权限
        run: chmod +x ./gradlew

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 上传 APK 产物
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
